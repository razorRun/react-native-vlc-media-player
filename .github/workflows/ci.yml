name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Called by release.yml so that nothing is ever published without passing here.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck library
        run: npm run typecheck

      # Parses src/VlcPlayerViewNativeComponent.ts with React Native's own codegen
      # parser and diffs it against what the native view managers declare. Phase 2b
      # and 2c generate native code from this spec, so a spec that does not parse or
      # has drifted from the managers has to fail here, not there.
      - name: Check codegen spec
        run: npm run check-spec

      # React Native's codegen Babel plugin runs on every file of a consuming app
      # and rejects some valid TypeScript. Nothing in this repo's own build runs
      # it, so an error there would otherwise only show up when an app bundles.
      - name: Check codegen Babel plugin
        run: npm run check-babel

      - name: Typecheck example
        run: npm run --workspace react-native-vlc-media-player-example typecheck

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

  # The four-configuration matrix is the only protection against silently breaking
  # the Legacy Architecture while it is still supported. React Native 0.81 is the
  # last release where `newArchEnabled=false` does anything at all — 0.82 removed
  # the Legacy Architecture — so the example app is pinned there.
  android:
    name: Android (${{ matrix.arch }} arch)
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [new, old]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v3 installs the SDK package `tools` by default, which the SDK repository
      # no longer has — sdkmanager exits 1 before anything is built. v4 defaults
      # to `platform-tools` only.
      - uses: android-actions/setup-android@v4

      - run: npm ci

      - name: Prebuild
        working-directory: example
        env:
          EXAMPLE_ARCH: ${{ matrix.arch }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assert architecture
        working-directory: example
        env:
          EXAMPLE_ARCH: ${{ matrix.arch }}
        run: |
          expected=$([ "$EXAMPLE_ARCH" = "old" ] && echo false || echo true)
          grep -qx "newArchEnabled=$expected" android/gradle.properties \
            || { echo "::error::expected newArchEnabled=$expected"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon

  ios:
    name: iOS (${{ matrix.arch }} arch)
    needs: verify
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [new, old]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Pinned on purpose. The Legacy Architecture path builds React Native from
      # source (Expo only enables the prebuilt frameworks when newArchEnabled is
      # true), and Pods/fmt 11.0.2 does not compile with the clang in Xcode 26+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - run: npm ci

      - name: Prebuild
        working-directory: example
        env:
          EXAMPLE_ARCH: ${{ matrix.arch }}
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ matrix.arch }}-${{ hashFiles('example/ios/Podfile.lock', 'react-native-vlc-media-player.podspec', 'package-lock.json') }}

      - name: Install pods
        working-directory: example/ios
        env:
          RCT_NEW_ARCH_ENABLED: ${{ matrix.arch == 'old' && '0' || '1' }}
        run: pod install

      # install_modules_dependencies() puts -DRCT_NEW_ARCH_ENABLED=1 into this pod's
      # xcconfig, which is exactly the flag the Phase 2 adapters are guarded by.
      - name: Assert architecture
        working-directory: example/ios
        env:
          EXAMPLE_ARCH: ${{ matrix.arch }}
        run: |
          xcconfig='Pods/Target Support Files/react-native-vlc-media-player/react-native-vlc-media-player.debug.xcconfig'
          if grep -q 'RCT_NEW_ARCH_ENABLED=1' "$xcconfig"; then
            actual=new
          else
            actual=old
          fi
          if [ "$actual" != "$EXAMPLE_ARCH" ]; then
            echo "::error::expected $EXAMPLE_ARCH arch, pod is configured for $actual"
            exit 1
          fi

      - name: Build
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace VLCMediaPlayerExample.xcworkspace \
            -scheme VLCMediaPlayerExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
